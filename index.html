          { url: 'https://cdn.jsdelivr.net/npm/chart.js' },

            after: function () {
              if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              }
            }
          },
          { url: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js' },

          { url: './face-auth.js',

              // face-auth.js is now defined — re-init the login page's face login if visible
              if (typeof window.__startFaceLoginFlow === 'function') {
                try { window.__startFaceLoginFlow(); } catch (e) { console.warn('face-auth init:', e); }
              }
            }
          }
        ];
        var i = 0;
        function next() {
          if (i >= heavy.length) return;
          var item = heavy[i++];
          var s = document.createElement('script');
          s.src = item.url;
          s.onload = function () {
            if (typeof item.after === 'function') { try { item.after(); } catch (e) { console.warn(e); } }
            next();
          };
          s.onerror = next;
          document.head.appendChild(s);
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(next, { timeout: 2500 });
        } else {
          setTimeout(next, 300);
        }
      });
    </script>

    <script>
(function(){
  function wireSplashAudio(){
    var v = document.getElementById('splash-video');
    var b = document.getElementById('splash-unmute-btn');
    if (!v || !b) return;
    b.style.display = 'block';
    function refresh(){
      b.innerHTML = v.muted ? '\uD83D\uDD07 Unmute' : '\uD83D\uDD0A Mute';
    }
    refresh();
    v.addEventListener('volumechange', refresh);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      e.preventDefault();
      v.muted = !v.muted;
      if (!v.muted) { v.play().catch(function(){}); }
      refresh();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireSplashAudio);
  } else {
    wireSplashAudio();
  }
})();
</script>
