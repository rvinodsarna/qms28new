<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      text-align: center;
      padding: 40px;
      max-width: 480px;
    }
    h1 {
      font-size: 72px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -2px;
    }
    p {
      font-size: 16px;
      color: #a0a4ab;
      margin: 8px 0 24px;
    }
    a {
      display: inline-block;
      padding: 10px 22px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist or has been removed.</p>
    <a href="/">Go to homepage</a>
  </div>
</body>
</html>
