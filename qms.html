<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIMY QMS RISE â€” Dean Command Center</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Supabase CDN MUST load before config.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Shared config: creates window.supabaseClient and window.QMS_READY -->
    <script src="/config.js"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --bg-card: rgba(10, 10, 38, .78);
            --glass-border: rgba(255, 255, 255, .09);
            --cyan: #00f0ff;
            --magenta: #ff2d7a;
            --violet: #7c3aed;
            --gold: #ffd700;
            --green: #00ff9d;
            --ink: #eaf0ff;
            --ink-muted: #9fb0d0;
            --ink-subtle: #5a6a8f;
            --radius-lg: 20px;
            --radius-md: 12px;
            --glow-c: 0 0 22px rgba(0, 240, 255, .5), 0 0 60px rgba(0, 240, 255, .16);
            --font-d: 'Space Grotesk', sans-serif;
            --font-m: 'Space Mono', monospace;
            --font-b: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #050510;
            color: var(--ink);
            font-family: var(--font-b);
            font-size: 14px;
            line-height: 1.55;
            overflow-x: hidden;
        }
        #bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse 55% 45% at 22% 18%, rgba(124, 58, 237, .2), transparent 60%),
                radial-gradient(ellipse 50% 50% at 78% 32%, rgba(0, 240, 255, .12), transparent 55%),
                radial-gradient(ellipse 45% 45% at 55% 85%, rgba(255, 45, 122, .1), transparent 55%),
                linear-gradient(160deg, #07081a 0%, #050510 55%, #020617 100%);
        }
        #neural {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .7;
            pointer-events: none;
        }
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .3;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 240, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, .05) 1px, transparent 1px);
            background-size: 52px 52px;
            -webkit-mask-image: radial-gradient(circle at 50% 30%, #000, transparent 75%);
            mask-image: radial-gradient(circle at 50% 30%, #000, transparent 75%);
        }
        .scanline {
            position: fixed;
            left: 0;
            right: 0;
            height: 140px;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(0, 240, 255, .04), transparent);
            animation: scan 7s linear infinite;
        }
        @keyframes scan { 0% { top: -20%; } 100% { top: 120%; } }

        #auth-gate {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, .16), transparent 55%), #050510;
            color: var(--ink-muted);
            font-family: var(--font-m);
            font-size: 12px;
            letter-spacing: 2px;
            text-align: center;
            padding: 20px;
        }
        #auth-gate .spin2 {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 240, 255, .2);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: rot .8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes rot { to { transform: rotate(360deg); } }

        #app { display: none; min-height: 100vh; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 20px;
            background: rgba(5, 5, 16, .88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border);
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-d);
            font-weight: 800;
            letter-spacing: -.02em;
        }
        .topbar .brand .dot {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #020617;
            box-shadow: var(--glow-c);
        }
        .topbar .brand small {
            display: block;
            font-family: var(--font-m);
            font-size: 9px;
            letter-spacing: .22em;
            color: var(--cyan);
            font-weight: 400;
        }
        .clock {
            margin-left: auto;
            font-family: var(--font-m);
            font-size: 13px;
            color: var(--cyan);
            text-align: right;
        }
        .clock small { display: block; color: var(--ink-muted); font-size: 9px; letter-spacing: 1px; }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 4px 4px 4px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, .85);
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--magenta));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #020617;
            flex-shrink: 0;
        }
        .user-meta { padding-right: 8px; }
        .uname { font-size: 13px; font-weight: 700; line-height: 1.1; }
        .urole {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--gold);
            display: block;
        }
        .btn-logout {
            background: rgba(255, 45, 122, .12);
            border: 1px solid rgba(255, 45, 122, .3);
            color: var(--magenta);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
            transition: all .2s;
            font-family: var(--font-b);
        }
        .btn-logout:hover { background: rgba(255, 45, 122, .22); }

        .layout { display: flex; min-height: calc(100vh - 64px); }
        .main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .hero {
            position: relative;
            margin-bottom: 24px;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            background: linear-gradient(120deg, rgba(124, 58, 237, .16), rgba(0, 240, 255, .08) 50%, rgba(255, 45, 122, .12));
            padding: 28px 26px;
            box-shadow: 0 0 60px rgba(124, 58, 237, .2);
        }
        .eyebrow {
            font-family: var(--font-m);
            font-size: 11px;
            letter-spacing: .3em;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hero h1 {
            font-family: var(--font-d);
            font-size: clamp(26px, 5vw, 50px);
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.05;
            background: linear-gradient(90deg, #fff, var(--cyan) 40%, var(--violet) 70%, var(--magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .type { font-family: var(--font-m); font-size: 13px; color: var(--ink-muted); margin-top: 8px; }
        .type b { color: var(--cyan); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .kpi-card {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            padding: 20px;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--violet));
        }
        .kpi-card.m::before { background: linear-gradient(90deg, var(--magenta), var(--violet)); }
        .kpi-card.g::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
        .kpi-card.w::before { background: linear-gradient(90deg, var(--gold), var(--magenta)); }
        .kpi-ico { font-size: 20px; margin-bottom: 9px; }
        .kpi-val {
            font-family: var(--font-d);
            font-size: 32px;
            font-weight: 800;
            color: var(--cyan);
            line-height: 1;
        }
        .kpi-card.m .kpi-val { color: var(--magenta); }
        .kpi-card.g .kpi-val { color: var(--green); }
        .kpi-card.w .kpi-val { color: var(--gold); }
        .kpi-lbl { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }

        .grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-bottom: 20px; }

        .card {
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            padding: 20px;
            animation: cardIn .5s both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: none; }
        }
        .card h3 {
            font-family: var(--font-d);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 13px;
        }
        .card h3 small {
            margin-left: auto;
            font-size: 10px;
            font-family: var(--font-m);
            color: var(--ink-subtle);
            letter-spacing: 1px;
        }

        .feed { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .feed li {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            padding: 11px 13px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .03);
            border-left: 2px solid var(--cyan);
        }
        .feed li.ok { border-left-color: var(--green); }
        .feed li.warn { border-left-color: var(--gold); }
        .feed li.danger { border-left-color: var(--magenta); }
        .f-t { font-size: 13px; color: var(--ink); }
        .f-s { font-size: 11px; color: var(--ink-muted); }

        .empty {
            padding: 26px;
            text-align: center;
            color: var(--ink-muted);
            font-family: var(--font-m);
            font-size: 12px;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--ink-muted);
            font-family: var(--font-m);
            font-size: 12px;
            padding: 40px;
        }
        .spin {
            border: 2px solid rgba(0, 240, 255, .2);
            border-top-color: var(--cyan);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: rot .8s linear infinite;
        }

        footer {
            text-align: center;
            font-family: var(--font-m);
            font-size: 10px;
            color: var(--ink-subtle);
            letter-spacing: .2em;
            padding: 16px 0 26px;
        }

        .horiz-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
        }
        .horiz-nav .nav-btn {
            flex: 1 0 auto;
            padding: 10px 16px;
            border-radius: 9px;
            background: none;
            border: none;
            color: var(--ink-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            transition: all .2s;
            font-family: var(--font-b);
        }
        .horiz-nav .nav-btn:hover { background: rgba(0, 240, 255, .07); color: var(--ink); }
        .horiz-nav .nav-btn.active {
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            color: #020617;
            box-shadow: var(--glow-c);
        }
        .horiz-nav .nav-btn .ico { font-size: 16px; }
        @media (max-width: 600px) { .horiz-nav .nav-btn { flex: 1 0 100%; } }

        .sec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .sec-card {
            background: rgba(10, 10, 38, .6);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px 18px;
        }
        .sec-card .sec-label {
            font-family: var(--font-m);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .15em;
            color: var(--ink-subtle);
            margin-bottom: 4px;
        }
        .sec-card .sec-value {
            font-family: var(--font-d);
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }
        .sec-card .sec-sub { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
        .sec-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 99px;
            font-family: var(--font-m);
            letter-spacing: .3px;
        }
        .sec-badge.active {
            background: rgba(0, 255, 136, .15);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, .25);
        }
        .sec-badge.operational {
            background: rgba(0, 240, 255, .1);
            color: var(--cyan);
            border: 1px solid rgba(0, 240, 255, .2);
        }
        .sec-divider { border: none; border-top: 1px solid var(--glass-border); margin: 14px 0; }
        @media (max-width: 700px) { .sec-grid { grid-template-columns: 1fr; } }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            text-align: left;
            padding: 8px 16px;
            font-family: var(--font-m);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--ink-subtle);
            border-bottom: 1px solid var(--cyan);
        }
        .data-table td {
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            font-size: 13px;
            vertical-align: middle;
        }
        .data-table tr:hover td { background: rgba(0, 240, 255, .04); }
        .table-wrap { overflow-x: auto; }

        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
        @media (max-width: 720px) {
            .main { padding: 16px; }
            .clock { display: none; }
            .user-meta { display: none; }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="bg"></div>
    <canvas id="neural"></canvas>
    <div class="grid-overlay"></div>
    <div class="scanline"></div>

    <!-- Auth gate: shown while verifying Dean role -->
    <div id="auth-gate">
        <div><span class="spin2"></span>VERIFYING DEAN AUTHORISATIONâ€¦</div>
    </div>

    <!-- App shell: hidden until auth gate passes -->
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <span class="dot">Q</span>
                <div>
                    UNIMY QMS RISE
                    <small>DEAN COMMAND CENTER Â· v25</small>
                </div>
            </div>
            <div class="clock" id="clock"></div>
            <div class="user">
                <div class="avatar" id="av">D</div>
                <div class="user-meta">
                    <div class="uname" id="un">Dean</div>
                    <span class="urole" id="ur">DEAN</span>
                </div>
                <button class="btn-logout" onclick="__logout()">Logout</button>
            </div>
        </header>
        <div class="layout">
            <main class="main" id="main">
                <div class="loading"><div class="spin"></div>CONNECTING TO SUPABASEâ€¦</div>
            </main>
        </div>
        <footer>UNIMY QMS RISE v25 Â· DEAN COMMAND CENTER Â· LIVE DATA Â· SECURED</footer>
    </div>

    <script>
    (async function () {
        "use strict";

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        // Small helpers
        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        const $ = (id) => document.getElementById(id);
        const esc = (v) =>
            v == null
                ? ""
                : String(v)
                      .replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#39;");

        function failGate(message) {
            const gate = $("auth-gate");
            if (gate) {
                gate.innerHTML =
                    '<div style="color:#ff2d7a;">' + esc(message) + "<br><small style='color:#9fb0d0;letter-spacing:1px;'>REDIRECTINGâ€¦</small></div>";
            }
            setTimeout(() => window.location.replace("/"), 1200);
        }

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        // Wait for shared Supabase client from config.js
        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        let client;
        try {
            await window.QMS_READY;
            client = window.supabaseClient;
            if (!client) throw new Error("window.supabaseClient not set by config.js");
        } catch (err) {
            console.error("[Dean] config startup failed:", err);
            failGate("CONFIGURATION FAILED");
            return;
        }

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        // Auth gate: require a valid session AND role === 'dean'
        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        let deanUser;
        try {
            const { data: { session } } = await client.auth.getSession();
            if (!session || !session.user) {
                failGate("NOT SIGNED IN");
                return;
            }

            const { data: staff, error: staffErr } = await client
                .from("staff")
                .select("id, name, email, role, school, avatar_url")
                .eq("id", session.user.id)
                .maybeSingle();

            if (staffErr || !staff) {
                console.error("[Dean] staff lookup failed:", staffErr);
                failGate("DEAN PROFILE NOT FOUND");
                return;
            }

            if (String(staff.role || "").toLowerCase() !== "dean") {
                failGate("DEAN ACCESS REQUIRED");
                return;
            }

            deanUser = staff;
        } catch (err) {
            console.error("[Dean] auth gate error:", err);
            failGate("AUTHENTICATION ERROR");
            return;
        }

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        // Everything below runs ONLY for verified deans.
        // `sb` is an alias so the route code stays readable.

        function countUp(node, target) {
            if (!node) return;
            const start = performance.now();
            const dur = 1200;
            const t0 = Number.isFinite(target) ? target : 0;
            (function tick(now) {
                const p = Math.min(1, (now - start) / dur);
                const eased = 1 - Math.pow(1 - p, 3);
                node.textContent = Math.round(t0 * eased).toLocaleString();
                if (p < 1) requestAnimationFrame(tick);
            })(start);
        }

        (function neuralBackground() {
            const c = $("neural");
            if (!c) return;
            const x = c.getContext("2d");
            let w = 0, h = 0, pts = [];

            function size() {
                w = c.width = window.innerWidth;
                h = c.height = window.innerHeight;
                const n = Math.min(70, Math.floor((w * h) / 20000));
                pts = [];
                for (let i = 0; i < n; i++) {
                    pts.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        r: Math.random() * 2 + 1,
                    });
                }
            }
            size();
            window.addEventListener("resize", size);

            (function draw() {
                x.clearRect(0, 0, w, h);
                pts.forEach((p) => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    x.beginPath();
                    x.arc(p.x, p.y, p.r, 0, 7);
                    x.fillStyle = "rgba(0,240,255,.55)";
                    x.fill();
                });
                for (let i = 0; i < pts.length; i++) {
                    for (let j = i + 1; j < pts.length; j++) {
                        const a = pts[i], b = pts[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < 120) {
                            x.strokeStyle = "rgba(0,240,255," + (0.10 * (1 - d / 120)) + ")";
                            x.beginPath();
                            x.moveTo(a.x, a.y);
                            x.lineTo(b.x, b.y);
                            x.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            })();
        })();

                '<span style="font-weight:600;color:var(--cyan);">ðŸŸ¢ Operational</span></div>' +
                "</div></div>" +

                '<div class="sec-card"><div class="sec-label">âš ï¸ Control Checks</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:4px;">' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Protected Environment</span><br>' +
                '<span style="font-weight:600;color:var(--cyan);">QMS Verified</span></div>' +
                "</div></div>" +

                "</div>" +
                '<hr class="sec-divider" />' +
                '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;">' +
                '<span style="font-size:11px;color:var(--ink-muted);font-family:var(--font-m);">' +
                "ðŸ“Š Dean-only operational view.</span>" +
                '<span class="sec-badge operational">QMS RISE Security</span> ' +
                '<span class="sec-badge active" style="background:rgba(255,45,122,0.1);color:var(--magenta);border-color:rgba(255,45,122,0.2);">Confidential Â· Dean Access Only</span>' +
                "</div>" +
                "</div>";

            renderPage(active || "security", content);
        }

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ LIVE FEED â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        let liveChan = null;
        let feedTimer = null;

        async function renderLive(active) {
            renderPage(active || "live", hero("ðŸŒ Real-Time Activity Stream", "Live Intelligence Feed"));

            const main = $("main");
            const container = document.createElement("div");
            container.innerHTML =
                '<div class="card"><h3>Live Feed <small>REALTIME Â· SUPABASE</small></h3>' +
                '<ul class="feed" id="liveFeed"></ul></div>';
            main.appendChild(container);

            const fd = $("liveFeed");

            async function seed() {
                if (!fd) return;
                const [comps, evs, crs, msgs] = await Promise.all([
                    rows("complaints", "status,created_at"),
                    rows("evaluations", "score,created_at"),
                    rows("credit_transfers", "status,created_at"),
                    rows("peer_chat_messages", "sender_name,created_at"),
                ]);

                const items = [];
                crs.forEach((r) =>
                    items.push({ type: "Credit transfer reviewed", detail: r.status || "unspecified", date: r.created_at, cls: "warn" }));
                evs.forEach((r) =>
                    items.push({ type: "Evaluation submitted", detail: "Score " + (typeof r.score === "number" ? r.score : "n/a"), date: r.created_at, cls: "ok" }));
                comps.forEach((r) =>
                    items.push({ type: "Complaint filed", detail: r.status || "unspecified", date: r.created_at, cls: "danger" }));
                msgs.forEach((r) =>
                    items.push({ type: "Peer message", detail: "from " + (r.sender_name || "student"), date: r.created_at, cls: "" }));

                items.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
                const top = items.slice(0, 10);

                if (!top.length) {
                    fd.innerHTML = '<li><div class="empty">No recent activity yet.</div></li>';
                    return;
                }
                fd.innerHTML = top
                    .map((it) =>
                        '<li class="' + (it.cls || "") + '"><div>' +
                        '<div class="f-t">' + esc(it.type) + "</div>" +
                        '<div class="f-s">' + esc(it.detail) +
                        (it.date ? " Â· " + esc(new Date(it.date).toLocaleDateString("en-GB")) : "") +
                        "</div></div></li>")
                    .join("");
            }

            seed();

            if (liveChan) { try { sb.removeChannel(liveChan); } catch (_) {} }
            try {
                liveChan = sb.channel("dean-realtime")
                    .on("postgres_changes", { event: "INSERT", schema: "public", table: "complaints" }, seed)
                    .on("postgres_changes", { event: "INSERT", schema: "public", table: "evaluations" }, seed)
                    .on("postgres_changes", { event: "INSERT", schema: "public", table: "credit_transfers" }, seed)
                    .on("postgres_changes", { event: "INSERT", schema: "public", table: "peer_chat_messages" }, seed)
                    .subscribe();
            } catch (_) {}

            clearInterval(feedTimer);
            feedTimer = setInterval(seed, 15000);
        }

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ Boot â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        $("auth-gate").remove();
        $("app").style.display = "block";

        const initials = String(deanUser.name || "Dean")
            .split(" ")
            .map((w) => w[0])
            .join("")
            .slice(0, 2)
            .toUpperCase();
        $("av").textContent = initials;
        $("un").textContent = deanUser.name || "Dean";
        $("ur").textContent = String(deanUser.role || "dean").toUpperCase();

        startClock();
        route("overview");
    })();
    </script>
</body>
</html>
